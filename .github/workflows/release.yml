on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # No setup-node on purpose: publishing relies on npm's OIDC trusted publishing (id-token above), and
      # setup-node's registry-url would write a token-based .npmrc instead. The runner's own Node is used.
      # Upgrade NPM to latest version (trusted publishing needs a recent npm)
      - run: sudo npm install -g npm
      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          release-type: node
          package-name: "@workadventure/simple-peer"
      # The logic below handles the npm publication:
      - uses: actions/checkout@v2
          # these if statements ensure that a publication only occurs when
        # a new release is created:
        if: ${{ steps.release.outputs.release_created }}
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 8.8.0
      # Install scripts would build node-datachannel, a native test dependency the runner's Node cannot build
      # (the prebuild fails on Node 24). Publishing only needs the TypeScript build.
      - run: pnpm install --ignore-scripts
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}
      - run: pnpm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        if: ${{ steps.release.outputs.release_created }}